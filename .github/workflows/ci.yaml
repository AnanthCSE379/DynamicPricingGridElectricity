name: Code checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: CPU checks (${{ matrix.pandas }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        pandas: ["pandas>=2.2,<3", "pandas>=3,<4"]
    env:
      MPLBACKEND: Agg
      OMP_NUM_THREADS: "4"
      MKL_NUM_THREADS: "4"
      PYTHONUNBUFFERED: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONHASHSEED: "0"
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            requirements-dashboard.txt

      - name: Install CPU dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'torch>=2.2' --index-url https://download.pytorch.org/whl/cpu
          make install-dev PYTHON=python
          python -m pip install '${{ matrix.pandas }}'

      # Streamlit 1.51 supports pandas 2. Keep it optional so its dependency
      # constraints cannot downgrade the separate pandas 3 pipeline checks.
      - name: Install optional dashboard dependencies
        if: matrix.pandas == 'pandas>=2.2,<3'
        run: python -m pip install -r requirements-dashboard.txt

      - name: Verify dependency consistency
        run: python -m pip check

      - name: Verify Makefile entry points
        run: |
          make help
          make help-legacy
          make pricing-status PYTHON=python PRICING_OUTPUT="${{ runner.temp }}/no-local-data"

      # Tests generate their own data, weather and checkpoints. No private files
      # or long-running research training are needed on the hosted CPU runner.
      - name: Check formatting, lint and all discovered tests
        env:
          MPLCONFIGDIR: ${{ runner.temp }}/matplotlib
        run: make check PYTHON=python
