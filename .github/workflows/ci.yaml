name: Code checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: CPU checks (${{ matrix.pandas }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        pandas: ["pandas>=2.2,<3", "pandas>=3,<4"]
    env:
      MPLBACKEND: Agg
      OMP_NUM_THREADS: "4"
      MKL_NUM_THREADS: "4"
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install CPU dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'torch>=2.2' --index-url https://download.pytorch.org/whl/cpu
          make install-dev PYTHON=python
          python -m pip install '${{ matrix.pandas }}'

      # Tests generate their own data, weather and checkpoints. No private files
      # or long-running research training are needed on the hosted CPU runner.
      - name: Run checks
        env:
          MPLCONFIGDIR: ${{ runner.temp }}/matplotlib
        run: make check PYTHON=python
